<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKOLAE - Divulgações</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>SKOLAE - Divulgações</h1>
            <div class="subtitle" id="subtitle">A calcular contactos...</div>
        </header>

        <nav>
            <div class="nav-tab active" onclick="switchTab('disparador')">Disparador de Campanhas</div>
            <div class="nav-tab" onclick="switchTab('dashboard')">Dashboard Histórico</div>
        </nav>

        <!-- View 1: Disparador -->
        <div id="view-disparador" class="view active">
            
            <div class="theme-input-container">
                <input type="text" id="campaign-theme" class="theme-input" placeholder="Nome do Tema da Campanha (ex: Palestra IA)" list="theme-suggestions">
                <datalist id="theme-suggestions">
                    <!-- JS fills this -->
                </datalist>
            </div>
            
            <div id="filter-pills" class="filter-pills">
                <!-- JS fills this -->
            </div>

            <div class="status-bar glass" id="status-bar" style="display: none;">
                <div class="status-stat">
                    <div class="stat-value" id="val-eligible">0</div>
                    <div class="stat-label">Contactos Prontos</div>
                </div>
                <div class="status-stat">
                    <div class="stat-value" id="val-batches">0</div>
                    <div class="stat-label">Lotes de Envio</div>
                </div>
                <div class="status-stat">
                    <div class="stat-value" id="val-rest">45</div>
                    <div class="stat-label">Dias de Descanso</div>
                </div>
            </div>

            <div class="batch-list" id="batch-list">
                <!-- Gerado via JS -->
            </div>
        </div>

        <!-- View 2: Dashboard -->
        <div id="view-dashboard" class="view">
            <div class="charts-grid">
                <div class="chart-card glass">
                    <h3>Envios ao Longo do Tempo</h3>
                    <canvas id="timelineChart"></canvas>
                </div>
                <div class="chart-card glass">
                    <h3>Temas Mais Enviados</h3>
                    <canvas id="themeChart"></canvas>
                </div>
                <div class="chart-card glass">
                    <h3>Distribuição por Função</h3>
                    <canvas id="rolesChart"></canvas>
                </div>
                <div class="chart-card glass">
                    <h3>Qualidade da Conta</h3>
                    <canvas id="categoriesChart"></canvas>
                </div>
            </div>

            <div class="table-container glass">
                <h3>Histórico Detalhado (Agrupado por Mês)</h3>
                <div id="history-accordion">
                    <!-- JS fills this -->
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
