<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-LEAP: Explorador de Roteiro Interativo</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --panel-color: #ffffff;
            --border-color: #e5e5e5;
            --text-primary: #000000;
            --text-secondary: #555555;
            
            /* Skolae Core Identity */
            --accent-orange: #FF9B23;
            --accent-orange-hover: #e08316;
            --accent-orange-light: rgba(255, 155, 35, 0.08);
            
            /* Trainer Pill Colors (Minimalist Black, White and Orange) */
            --bg-comportamental: rgba(255, 155, 35, 0.08);
            --border-comportamental: #FF9B23;
            
            --bg-financeiro: rgba(0, 0, 0, 0.05);
            --border-financeiro: #000000;
            
            --bg-tecnico: rgba(85, 85, 85, 0.08);
            --border-tecnico: #555555;
            
            --bg-esg: rgba(16, 185, 129, 0.08);
            --border-esg: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 155, 35, 0.02) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(0, 0, 0, 0.02) 0%, transparent 40%);
        }

        header {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo-img {
            height: 52px;
            width: auto;
            object-fit: contain;
        }

        .logo-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .logo-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.1rem;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        .toggle-btn {
            background-color: var(--bg-color);
            border: 2px solid var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toggle-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .toggle-btn.active {
            background-color: var(--text-primary);
            color: var(--bg-color);
            border-color: var(--text-primary);
        }

        .toggle-btn.active-esg {
            background-color: var(--accent-orange);
            color: var(--bg-color);
            border-color: var(--accent-orange);
        }
        
        .toggle-btn.active-esg:hover {
            background-color: var(--accent-orange-hover);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2.5rem;
            min-height: calc(100vh - 120px);
        }

        /* Profiles Menu Left */
        .profiles-panel {
            background-color: var(--panel-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .profile-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .profile-item {
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background-color: var(--bg-color);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            position: relative;
        }

        .profile-item:hover {
            border-color: var(--text-primary);
            background-color: rgba(0, 0, 0, 0.02);
        }

        .profile-item.active {
            border-color: var(--accent-orange);
            background-color: var(--accent-orange-light);
        }

        .profile-item.active::before {
            content: '';
            position: absolute;
            left: -2px;
            top: 15%;
            bottom: 15%;
            width: 4px;
            background-color: var(--accent-orange);
            border-radius: 0 4px 4px 0;
        }

        .profile-item .role-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .profile-item .role-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Filter Panel Legend */
        .legend-panel {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid var(--border-color);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
            font-weight: 600;
        }

        .legend-item:hover {
            background-color: rgba(0, 0, 0, 0.03);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .legend-dot.comportamental { background-color: var(--border-comportamental); }
        .legend-dot.financeiro { background-color: var(--border-financeiro); }
        .legend-dot.tecnico { background-color: var(--border-tecnico); }
        .legend-dot.esg { background-color: var(--border-esg); }

        /* Courses Timeline Right */
        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-primary);
            padding-bottom: 0.75rem;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem;
            font-weight: 700;
        }

        .section-badge {
            background-color: var(--text-primary);
            color: var(--bg-color);
            padding: 0.35rem 0.9rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .course-card {
            background-color: var(--panel-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .course-card:hover {
            transform: translateY(-3px);
            border-color: var(--text-primary);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        /* Minimalist Trainer Accent Borders */
        .course-card.comportamental {
            border-top: 6px solid var(--border-comportamental);
        }
        .course-card.financeiro {
            border-top: 6px solid var(--border-financeiro);
        }
        .course-card.tecnico {
            border-top: 6px solid var(--border-tecnico);
        }
        .course-card.esg {
            border-top: 6px solid var(--border-esg);
            background: linear-gradient(180deg, var(--panel-color) 0%, rgba(16, 185, 129, 0.01) 100%);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .course-num {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .duration-badge {
            background-color: rgba(0, 0, 0, 0.05);
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .course-name {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            line-height: 1.4;
            min-height: 3.5rem;
            color: var(--text-primary);
        }

        .trainer-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            width: fit-content;
            border: 1px solid transparent;
        }

        .trainer-tag.comportamental {
            background-color: var(--bg-comportamental);
            color: var(--border-comportamental);
            border-color: rgba(255, 155, 35, 0.2);
        }
        .trainer-tag.financeiro {
            background-color: var(--bg-financeiro);
            color: var(--border-financeiro);
            border-color: rgba(0, 0, 0, 0.1);
        }
        .trainer-tag.tecnico {
            background-color: var(--bg-tecnico);
            color: var(--border-tecnico);
            border-color: rgba(85, 85, 85, 0.2);
        }
        .trainer-tag.esg {
            background-color: var(--bg-esg);
            color: var(--border-esg);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .card-footer {
            margin-top: auto;
            border-top: 2px solid var(--border-color);
            padding-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .alignment-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .alignment-desc {
            font-size: 0.8rem;
            line-height: 1.4;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .mapping-box {
            background-color: rgba(0, 0, 0, 0.01);
            border: 1px dashed var(--border-color);
            padding: 0.75rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .rfi-title {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .rfi-val {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-orange);
        }

        /* Modal Details */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 100;
            padding: 1.5rem;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-color);
            border: 2px solid var(--text-primary);
            width: 100%;
            max-width: 680px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
            transform: scale(0.96);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .modal-title-box {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: #000;
        }

        .modal-body {
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .syllabus-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            border-left: 4px solid var(--accent-orange);
            padding-left: 0.6rem;
            margin-bottom: 0.75rem;
        }

        .module-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .module-item {
            background-color: rgba(0, 0, 0, 0.01);
            border: 2px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent-orange);
        }

        .module-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .module-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.4;
            font-weight: 500;
        }

        .ref-box {
            background-color: rgba(255, 155, 35, 0.03);
            border: 1.5px dashed rgba(255, 155, 35, 0.3);
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.4;
            color: var(--text-primary);
        }

        .ref-box a {
            color: var(--accent-orange);
            text-decoration: none;
            font-weight: 600;
        }

        .ref-box a:hover {
            text-decoration: underline;
        }

        /* Fade-in Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .course-card {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="../01_Conhecimento_Base/SKOLAE Formação Logo noir.jpg" alt="SKOLAE" class="logo-img">
            <div class="logo-text">
                <h1>Q-LEAP</h1>
                <p>Quadrante Leadership Excellence & Acceleration Program — Explorador Estrutural</p>
            </div>
        </div>
        <div class="controls">
            <button class="toggle-btn active" id="viewModeBtn" onclick="toggleViewMode()">
                👁️ Vista Q-LEAP Sugerida
            </button>
            <button class="toggle-btn active-esg" id="esgBtn" onclick="toggleESG()">
                🌱 Mostrar Especializações ESG
            </button>
        </div>
    </header>

    <main>
        <!-- Profiles Panel (Left) -->
        <div class="profiles-panel">
            <div class="panel-title">👥 Públicos-Alvo</div>
            <div class="profile-list" id="profileList">
                <!-- Injetado via JS -->
            </div>
            
            <div class="legend-panel">
                <div class="panel-title">🎯 Perfis de Formadores</div>
                <div class="legend-item" onclick="filterTrainer('comportamental')">
                    <span class="legend-dot comportamental"></span>
                    <span>Comportamental</span>
                </div>
                <div class="legend-item" onclick="filterTrainer('financeiro')">
                    <span class="legend-dot financeiro"></span>
                    <span>Financeiro</span>
                </div>
                <div class="legend-item" onclick="filterTrainer('tecnico')">
                    <span class="legend-dot tecnico"></span>
                    <span>Técnico de Gestão</span>
                </div>
                <div class="legend-item" onclick="filterTrainer('esg')">
                    <span class="legend-dot esg"></span>
                    <span>Especialista ESG</span>
                </div>
                <div class="legend-item" onclick="clearTrainerFilter()" style="justify-content: center; border: 2px dashed var(--border-color); margin-top: 1rem; color: var(--text-primary);">
                    <span>Limpar Filtros</span>
                </div>
            </div>
        </div>

        <!-- Courses Panel (Right) -->
        <div class="timeline-container">
            <div class="section-header">
                <h2 class="section-title" id="activeProfileTitle">Carregando...</h2>
                <span class="section-badge" id="activeProfileCount">0 Cursos</span>
            </div>
            
            <div class="course-grid" id="courseGrid">
                <!-- Injetado via JS -->
            </div>
        </div>
    </main>

    <!-- Detailed Modal -->
    <div class="modal" id="detailsModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title-box">
                    <span class="course-num" id="modalCourseNum">CURSO 1.1</span>
                    <h2 class="section-title" style="font-size: 1.3rem;" id="modalCourseName">Nome do Curso</h2>
                </div>
                <button class="modal-close" onclick="closeModal(event)">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Injetado via JS -->
            </div>
        </div>
    </div>

    <!-- Data Object -->
    <script>
        const qLeapData = {

                        {

                            source: "01_Vendas_e_Negociacao/Curso_KAM_Key_Account_Management.md",
                            modules: [
                                { num: "M1", name: "Relações Estratégicas no Mercado", desc: "Gestão e monitorização do pipeline comercial sénior da BU e parcerias estruturais de longo prazo." },
                                { num: "M2", name: "Colaboração Comercial cross-BU", desc: "Fomentar a cross-fertilization de leads comerciais entre diferentes Unidades de Negócio." },
                                { num: "M3", name: "Negociação em Matrizes e Acordos Multipartidários", desc: "Exercer influência sem autoridade formal direta em comissões executivas corporativas." },
                                { num: "M4", name: "Negociação de Grandes Contratos", desc: "Liderar processos negociais de fecho de contratos complexos de elevado valor." }
                            ]
                        },
                        {
                            id: "5.4",
                            name: "Inovação, Design Thinking e Pensamento Empreendedor",
                            rfiName: "Innovation & Entrepreneurial Thinking [SPECIALIST]",
                            duration: "14h",
                            trainer: "comportamental",
                            trainerLabel: "Inovação",
                            alignmentLabel: "Problem Solving Criativo",
                            alignmentDesc: "Ensina a passar de ideias de inovação para mini business cases rápidos e protótipos de serviços.",
                            source: "15_Gestao_Projetos_e_Inovacao/Design_Thinking_na_Gestao_de_Projetos.md",
                            modules: [
                                { num: "M1", name: "Criatividade e Intraempreendedorismo", desc: "Conceitos de inovação de serviços aplicados ao ecossistema da BU." },
                                { num: "M2", name: "Abordagem Baseada em Problem Solving e Ideation", desc: "O processo criativo do Design Thinking (fases de Empatia, Identificação e Insights)." },
                                { num: "M3", name: "Geração de Ideias Disruptivas", desc: "Técnicas estruturadas de brainstorming e co-criação de soluções de serviços inovadores." },
                                { num: "M4", name: "Construção de Experiências e Business Cases", desc: "Passagem das ideias a oportunidades reais através da elaboração rápida de protótipos e mini business cases." }
                            ]
                        },
                        {
                            id: "5.5",
                            name: "Workshop Estratégico de Sustentabilidade e Liderança ESG",
                            rfiName: "Recomendação Skolae: Liderança ESG",
                            duration: "3,5h",
                            trainer: "esg",
                            trainerLabel: "Especialista ESG",
                            alignmentLabel: "Cocriação ESG",
                            alignmentDesc: "Workshop imersivo de alinhamento com Design Thinking para diretores desenharem planos de ação ESG.",
                            source: "14_Sustentabilidade_ESG/curso_workshop_sustentabilidade_esg.md",
                            isESG: true,
                            modules: [
                                { num: "M1", name: "Conceitos e Contexto ESG Corporativo", desc: "Alinhamento estratégico sobre o papel do ESG no mercado de infraestruturas e consultoria B2B." },
                                { num: "M2", name: "Co-criação Rumo à Sustentabilidade", desc: "Aplicação prática de Design Thinking para idealizar e desenhar o plano de ação sustentável da BU." },
                                { num: "M3", name: "Mobilização de Equipas", desc: "Estrategias de liderança para envolver os colaboradores, fomentar comportamentos sustentáveis no terreno e gerir a mudança rumo à conformidade ecológica." }
                            ]
                        }
                    ]
                }
            }
        };

        function renderProfiles() {
            const list = document.getElementById("profileList");
            list.innerHTML = "";
            
            Object.keys(qLeapData.profiles).forEach(key => {
                const p = qLeapData.profiles[key];
                const activeClass = qLeapData.activeProfile === key ? "active" : "";
                
                // Calculate count depending on showESG
                const coursesList = qLeapData.showESG 
                    ? p.courses 
                    : p.courses.filter(c => !c.isESG);
                
                list.innerHTML += `
                    <div class="profile-item ${activeClass}" onclick="selectProfile('${key}')">
                        <span class="role-title">${p.title}</span>
                        <span class="role-desc">${p.desc} • ${coursesList.length} Cursos</span>
                    </div>
                `;
            });
        }

        function renderCourses() {
            const grid = document.getElementById("courseGrid");
            grid.innerHTML = "";
            
            const profileKey = qLeapData.activeProfile;
            const p = qLeapData.profiles[profileKey];
            
            document.getElementById("activeProfileTitle").innerText = p.title;
            
            let coursesList = p.courses;
            
            // Filter by ESG toggle
            if (!qLeapData.showESG) {
                coursesList = coursesList.filter(c => !c.isESG);
            }
            
            // Filter by Trainer Category click
            if (qLeapData.trainerFilter) {
                coursesList = coursesList.filter(c => c.trainer === qLeapData.trainerFilter);
            }
            
            document.getElementById("activeProfileCount").innerText = `${coursesList.length} Curso(s)`;
            
            if (coursesList.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; padding: 3rem; text-align: center; color: var(--text-secondary); border: 2px dashed var(--border-color); border-radius: 12px;">
                        Nenhum curso corresponde ao filtro selecionado.
                    </div>
                `;
                return;
            }
            
            coursesList.forEach((c, idx) => {
                const isQLeap = qLeapData.viewMode === "qleap";
                
                const cardTitle = isQLeap ? c.name : c.rfiName;
                const cardHeaderLabel = isQLeap ? `CURSO ${c.id}` : `REQUISITO RFI`;
                
                grid.innerHTML += `
                    <div class="course-card ${c.trainer}" onclick="openModal('${profileKey}', '${c.id}')">
                        <div class="card-header">
                            <span class="course-num">${cardHeaderLabel}</span>
                            <span class="duration-badge">${c.duration}</span>
                        </div>
                        <h3 class="course-name">${cardTitle}</h3>
                        
                        <div class="trainer-tag ${c.trainer}">
                            👤 ${c.trainerLabel}
                        </div>
                        
                        <div class="card-footer">
                            <span class="alignment-label">${c.alignmentLabel}</span>
                            <p class="alignment-desc">${c.alignmentDesc}</p>
                            
                            ${!isQLeap ? `
                                <div class="mapping-box">
                                    <span class="rfi-title">SUGESTÃO SKOLAE:</span>
                                    <span class="rfi-val">${c.name}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function selectProfile(key) {
            qLeapData.activeProfile = key;
            renderProfiles();
            renderCourses();
        }

        function toggleViewMode() {
            const btn = document.getElementById("viewModeBtn");
            if (qLeapData.viewMode === "qleap") {
                qLeapData.viewMode = "rfi";
                btn.innerText = "📋 Vista Pedido RFI Cliente";
                btn.classList.remove("active");
            } else {
                qLeapData.viewMode = "qleap";
                btn.innerText = "👁️ Vista Q-LEAP Sugerida";
                btn.classList.add("active");
            }
            renderCourses();
        }

        function toggleESG() {
            const btn = document.getElementById("esgBtn");
            qLeapData.showESG = !qLeapData.showESG;
            if (qLeapData.showESG) {
                btn.classList.add("active-esg");
                btn.innerText = "🌱 Mostrar Especializações ESG";
            } else {
                btn.classList.remove("active-esg");
                btn.innerText = "🍂 Ocultar Especializações ESG";
            }
            renderProfiles();
            renderCourses();
        }

        function filterTrainer(type) {
            qLeapData.trainerFilter = type;
            renderCourses();
        }

        function clearTrainerFilter() {
            qLeapData.trainerFilter = null;
            renderCourses();
        }

        // Modal Handlers
        function openModal(profileKey, courseId) {
            const c = qLeapData.profiles[profileKey].courses.find(item => item.id === courseId);
            if (!c) return;
            
            document.getElementById("modalCourseNum").innerText = `CURSO ${c.id} • ${c.duration}`;
            document.getElementById("modalCourseName").innerText = c.name;
            
            const modalBody = document.getElementById("modalBody");
            modalBody.innerHTML = "";
            
            // Info block
            modalBody.innerHTML += `
                <div style="display: flex; gap: 1rem; align-items: center; background-color: rgba(0,0,0,0.01); padding: 1rem; border-radius: 8px; border: 2px solid var(--border-color)">
                    <div class="trainer-tag ${c.trainer}">👤 Formador: ${c.trainerLabel}</div>
                    <div style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;">Público-Alvo: ${qLeapData.profiles[profileKey].title}</div>
                </div>
            `;
            
            // Syllabus
            let syllabusHTML = `
                <div>
                    <h4 class="syllabus-title">Conteúdo Programático Detalhado</h4>
                    <div class="module-list">
            `;
            
            c.modules.forEach(m => {
                syllabusHTML += `
                    <div class="module-item">
                        <div class="module-header">
                            <span>${m.num}</span>
                            <span>Módulo Especializado</span>
                        </div>
                        <span class="module-name">${m.name}</span>
                        <p class="module-desc">${m.desc}</p>
                    </div>
                `;
            });
            
            syllabusHTML += `
                    </div>
                </div>
            `;
            
            modalBody.innerHTML += syllabusHTML;
            
            // Reference
            modalBody.innerHTML += `
                <div class="ref-box">
                    <strong>Rastreabilidade de Catálogo Skolae:</strong><br>
                    Baseado no programa padrão do catálogo:<br>
                    <a href="file:///${c.source}" target="_blank">📄 ${c.source.split('/').pop()}</a>
                </div>
            `;
            
            document.getElementById("detailsModal").classList.add("active");
        }

        function closeModal(event) {
            document.getElementById("detailsModal").classList.remove("active");
        }

        // Init
        window.onload = () => {
            renderProfiles();
            renderCourses();
        };
    </script>
</body>
</html>
